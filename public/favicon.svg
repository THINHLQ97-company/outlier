<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Outlier">
  <title>Outlier</title>
  <defs>
    <linearGradient id="oLift" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1e1b4b"/>
  <!-- đám điểm: phân bố chung, chìm -->
  <g fill="#c7d2fe" opacity="0.34">
    <circle cx="18" cy="45" r="2.6"/>
    <circle cx="25" cy="39" r="3.1"/>
    <circle cx="22" cy="49" r="2.2"/>
    <circle cx="32" cy="43" r="3.4"/>
    <circle cx="30" cy="34" r="2.4"/>
    <circle cx="38" cy="48" r="2.7"/>
  </g>
  <!-- đường bao mức thường -->
  <path d="M13 52 Q28 30 44 50" fill="none" stroke="#c7d2fe" stroke-opacity="0.30"
        stroke-width="1.6" stroke-dasharray="3 3.5" stroke-linecap="round"/>
  <!-- điểm bật ra ngoài -->
  <circle cx="47" cy="17" r="7.5" fill="url(#oLift)"/>
  <circle cx="47" cy="17" r="12" fill="none" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.8"/>
</svg>
