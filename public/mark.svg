<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Outlier">
  <title>Outlier</title>
  <defs>
    <linearGradient id="mLift" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#312e81"/>
  <!-- chỉ 3 chấm nền, to và rõ hơn hẳn để không biến mất ở cỡ nhỏ -->
  <g fill="#a5b4fc" opacity="0.55">
    <circle cx="17" cy="47" r="4"/>
    <circle cx="28" cy="41" r="4.6"/>
    <circle cx="39" cy="46" r="3.6"/>
  </g>
  <!-- điểm bật ra ngoài: to, sáng, có vòng nhấn -->
  <circle cx="44" cy="20" r="11" fill="url(#mLift)"/>
  <circle cx="44" cy="20" r="11" fill="none" stroke="#c7d2fe" stroke-opacity="0.9" stroke-width="2"/>
</svg>
