<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="Outlier">
  <title>Outlier</title>
  <g>
    <!-- đám chấm: phân bố chung, mờ -->
    <g fill="#a8523a" opacity="0.28">
      <circle cx="12" cy="31" r="2.4"/>
      <circle cx="19" cy="25" r="2.9"/>
      <circle cx="17" cy="35" r="2.1"/>
      <circle cx="26" cy="29" r="3.2"/>
      <circle cx="24" cy="20" r="2.2"/>
      <circle cx="31" cy="34" r="2.5"/>
      <circle cx="33" cy="24" r="2.8"/>
      <circle cx="21" cy="31" r="2.0"/>
    </g>
    <!-- đường bao phân bố -->
    <ellipse cx="23" cy="28" rx="16" ry="11" fill="none" stroke="#a8523a" stroke-opacity="0.32"
             stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- THE OUTLIER: chấm sáng bật hẳn ra ngoài -->
    <circle cx="42" cy="11" r="5.2" fill="#d97757"/>
    <circle cx="42" cy="11" r="8.4" fill="none" stroke="#d97757" stroke-opacity="0.45" stroke-width="1.3"/>
  </g>
  <text x="60" y="34" font-family="'Be Vietnam Pro','Inter',system-ui,sans-serif"
        font-size="23" font-weight="700" fill="#2D2D2D" letter-spacing="-0.4">Outlier</text>
</svg>
